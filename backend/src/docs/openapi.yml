paths:
  # --- SUPERADMIN ---
  /superadmin/login:
    post:
      tags:
        - Super Admin
      summary: SuperAdmin login
      description: |
        Platform-only authentication. Returns a SuperAdmin JWT for managing tenant Admin accounts.
      operationId: superadmin_login
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuperAdminLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperAdminLoginResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /superadmin/admins:
    get:
      tags:
        - Super Admin
      summary: List tenant Admins
      operationId: superadmin_list_admins
      x-implemented: true
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TenantAdminResponseData'

  /superadmin/admins/{id}:
    get:
      tags:
        - Super Admin
      summary: Get tenant Admin by id
      operationId: superadmin_get_admin
      x-implemented: true
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminDetailResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /superadmin/admins/{id}/verify:
    put:
      tags:
        - Super Admin
      summary: Set tenant Admin onboarding verification
      description: |
        Updates `AdminOnboardingProgress.verificationStatus` after the tenant has purchased a plan and submitted business/KYC details.
        Does not create Admin accounts (tenants register and onboard separately).
      operationId: superadmin_verify_admin_onboarding
      x-implemented: true
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantAdminVerifyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminDetailResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /superadmin/admins/{id}/disable:
    put:
      tags:
        - Super Admin
      summary: Disable tenant Admin
      operationId: superadmin_disable_admin
      x-implemented: true
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
