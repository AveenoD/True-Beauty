  # --- AUTH ---
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register new user account
      description: |
        Priority: Phase 0 / Day 1
        ERD tables: User, AuthToken
        Implementation: Creates user, generates access+refresh JWT tokens, stores refresh token in DB.
        AuthToken expiry: access=15min, refresh=7days.
      operationId: op_1_post_impl
      x-phase: Phase 0
      x-day: Day 1
      x-erd-tables:
        - User
        - AuthToken
      x-priority-order: 1
      x-implemented: true
      x-implemented-date: "13-04-2026"
      x-controller: src/controllers/auth.controller.ts
      x-service: src/services/auth.service.ts
      x-route-file: src/routes/auth.routes.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: "John Doe"
              email: "john@example.com"
              password: "securepassword123"
              phone: "+919876543210"
              referralCode: "ABC123"
      responses:
        '201':
          description: Created — user registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                success: true
                message: "Registration successful"
                data:
                  user:
                    id: "uuid"
                    name: "John Doe"
                    email: "john@example.com"
                    role: "customer"
                    referralCode: "X1Y2Z3"
                  accessToken: "eyJhbG..."
                  refreshToken: "eyJhbG..."
        '409':
          description: Conflict — email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          description: Unprocessable — validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      description: |
        Priority: Phase 0 / Day 1
        ERD tables: User, AuthToken
        Implementation: Validates credentials, issues access+refresh JWT tokens.
      operationId: op_2_post_impl
      x-phase: Phase 0
      x-day: Day 1
      x-erd-tables:
        - User
        - AuthToken
      x-priority-order: 2
      x-implemented: true
      x-implemented-date: "13-04-2026"
      x-controller: src/controllers/auth.controller.ts
      x-service: src/services/auth.service.ts
      x-route-file: src/routes/auth.routes.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "john@example.com"
              password: "securepassword123"
      responses:
        '200':
          description: OK — login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized — invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          description: Unprocessable — validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /auth/logout:
    post:
      tags:
        - Auth
