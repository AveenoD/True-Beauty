      x-controller: src/controllers/auth.controller.ts
      x-service: src/services/auth.service.ts
      x-route-file: src/routes/auth.routes.ts
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: OK — logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: |
        Priority: Phase 0 / Day 1
        ERD tables: AuthToken, User
        Implementation: Validates refresh token, revokes old token, issues new access+refresh tokens.
      operationId: op_4_post_impl
      x-phase: Phase 0
      x-day: Day 1
      x-erd-tables:
        - AuthToken
        - User
      x-priority-order: 4
      x-implemented: true
