          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          description: Unprocessable — invalid plan ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

