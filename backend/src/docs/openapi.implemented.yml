paths:
  # --- AUTH ---
  /users/register:
    post:
      tags:
        - Auth
      summary: Register new user account
      description: |
        Priority: Phase 0 / Day 1
        ERD tables: User, AuthToken
        Implementation: Creates user, generates access+refresh JWT tokens, stores refresh token in DB.
        AuthToken expiry: access=15min, refresh=7days.
      operationId: op_1_post_impl
      x-phase: Phase 0
      x-day: Day 1
      x-erd-tables:
        - User
        - AuthToken
      x-priority-order: 1
      x-implemented: true
      x-implemented-date: "13-04-2026"
      x-controller: src/controllers/auth.controller.ts
      x-service: src/services/auth.service.ts
      x-route-file: src/routes/auth.routes.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: "John Doe"
              email: "john@example.com"
              password: "Securepassword123!"
              phone: "+919876543210"
      responses:
        '201':
          description: Created — user registered successfully (email verification required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: "Registration successful. Please verify your email to login."
                data:
                  user:
                    id: "uuid"
                    name: "John Doe"
                    email: "john@example.com"
                    role: "customer"
                  verificationEmailSent: true
        '409':
          description: Conflict — email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          description: Unprocessable — validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /users/login:
    post:
      tags:
        - Auth
      summary: Login user
      description: |
        Priority: Phase 0 / Day 1
        ERD tables: User, AuthToken
        Implementation: Validates credentials, issues access+refresh JWT tokens.
      operationId: op_2_post_impl
      x-phase: Phase 0
      x-day: Day 1
      x-erd-tables:
        - User
        - AuthToken
      x-priority-order: 2
      x-implemented: true
      x-implemented-date: "13-04-2026"
      x-controller: src/controllers/auth.controller.ts
      x-service: src/services/auth.service.ts
      x-route-file: src/routes/auth.routes.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "john@example.com"
              password: "Securepassword123!"
      responses:
        '200':
          description: OK — login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized — invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          description: Unprocessable — validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /users/verify-email:
    get:
      tags:
        - Auth
      summary: Verify email address
      description: |
        Verifies the user's email using a one-time token sent via email.
        On success, redirects to frontend address page.
      operationId: op_verify_email_get_impl
      x-implemented: true
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to frontend address page
        '400':
          description: Invalid token

  /users/resend-verification:
    post:
      tags:
        - Auth
      summary: Re-send verification email
      description: |
        Re-sends the email verification link.
        Max 3 requests per user per 24 hours.
      operationId: op_resend_verify_post_impl
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '429':
          description: Too many requests

  /users/forgot-password:
    post:
      tags:
        - Auth
      summary: Request password reset
      description: |
        Sends a password reset link to the user's email (if the account exists).
        Always returns success to prevent email enumeration.
      operationId: op_forgot_password_post_impl
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
