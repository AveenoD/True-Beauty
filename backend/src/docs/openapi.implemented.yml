          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /users/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password using email token
      description: |
        Resets password using a one-time token sent via email.
        Token is single-use and expires after a short window.
      operationId: op_reset_password_post_impl
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
