      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid/expired token

  /users/change-password:
    post:
      tags:
        - Auth
      summary: Change password (logged-in)
      description: |
        Changes password for the authenticated user.
        Requires current password and a strong new password.
      operationId: op_change_password_post_impl
      x-implemented: true
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
            example:
              currentPassword: "Securepassword123!"
              newPassword: "Securepassword123!#"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

